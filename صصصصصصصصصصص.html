
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    background: #08080e;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: #11111b;
    padding: 35px 25px;
    border-radius: 25px;
    border: 1px solid #29293d;
    box-shadow: 0 0 40px #9333ea22;
}

.profile {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    border: 3px solid #a855f7;
    object-fit: cover;
    margin-bottom: 18px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.username {
    color: #a855f7;
    margin-bottom: 12px;
}

.bio {
    color: #999;
    font-size: 14px;
    margin-bottom: 30px;
}

.social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 16px;
    margin: 14px 0;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    background: #1c1c2b;
    border: 1px solid #303044;
    transition: 0.3s;
    font-weight: bold;
}

.social-link:hover {
    transform: translateY(-5px);
    background: #9333ea;
    box-shadow: 0 5px 25px #9333ea55;
}

.social-link span {
    font-size: 20px;
}

footer {
    color: #666;
    font-size: 12px;
    margin-top: 30px;
}

</style>
</head>

<body>

<div class="container">

    <!-- Change profile.jpg to your photo -->
    <img src="" class="profile" alt="Profile">

    <h1>Abdo Osama</h1>

    <div class="username">@abdo11</div>

    <p class="bio">
        Welcome to my world.
        Follow me on my social media!
    </p>

    <a href="https://instagram.com/romana1_/"
       target="_blank" class="social-link">
        <span>📸</span> Instagram
    </a>

    <a href="https://wa.me/2001559872411"
       target="_blank" class="social-link">
        <span>💬</span> WhatsApp
    </a>

    <a href="https://discord.com/users/romanaosama_99518"
       target="_blank" class="social-link">
        <span>🎮</span> Discord
    </a>

    <footer>
        © 2026 Abdo | All Rights Reserved
    </footer>

</div>

</body>
</html>
